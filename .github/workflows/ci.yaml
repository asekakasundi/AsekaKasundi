name: Continuous Integration

on:
  push:
    branches:
      - '**' # Tests all branches on push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify HTML File Exists
        run: test -f index.html

      - name: Verify CSS File Exists
        run: test -f style.css

      - name: Verify Images Directory Exists
        run: test -d Images  

      - name: CI Successful
        run: echo "Website Passed Validation"