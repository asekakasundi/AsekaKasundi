name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Structural checks
      - name: Verify HTML File Exists
        run: test -f index.html

      - name: Verify CSS File Exists
        run: test -f style.css

      # Check HTML syntax
      - name: Lint HTML
        uses: htmlhint/htmlhint-action@v2
        with:
          file_pattern: 'index.html'

      # 3. Check CSS syntax using a pre-built standard action
      - name: Lint CSS
        uses: m1guelpf/css-linter-action@v1
        with:
          path: 'style.css'

      - name: CI Successful
        run: echo "Website Passed Validation"